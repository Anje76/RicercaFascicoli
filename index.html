<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricercatore di Fascicoli per Assistenti Disperati</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libreria SheetJS per lettura e parsing Excel (.xls / .xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @keyframes highlightPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      50% { transform: scale(1.03); box-shadow: 0 0 20px 10px rgba(234, 179, 8, 0.5); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    .highlight-found {
      animation: highlightPulse 1.2s ease-in-out 3;
      border-color: #eab308 !important;
      border-width: 2px !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <!-- Header con Nuovo Titolo e Logo Simpatico -->
  <header class="bg-indigo-800 text-white p-3.5 shadow-lg sticky top-0 z-40 border-b border-indigo-600">
    <div class="max-w-md mx-auto flex justify-between items-center gap-2">
      
      <!-- LOGO + TITOLO -->
      <div class="flex items-center gap-2.5">
        
        <!-- Logo SVG: Cartellina in Panico -->
        <div class="relative w-11 h-11 flex-shrink-0 bg-amber-400 rounded-2xl p-1 shadow-md flex items-center justify-center border-2 border-amber-300">
          <svg class="w-9 h-9" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Cartella -->
            <path d="M6 16C6 12.6863 8.68629 10 12 10H24L30 16H52C55.3137 16 58 18.6863 58 22V48C58 51.3137 55.3137 54 52 54H12C8.68629 54 6 51.3137 6 48V16Z" fill="#FBBF24" stroke="#78350F" stroke-width="3"/>
            <!-- Fogli dentro -->
            <rect x="16" y="20" width="32" height="6" rx="2" fill="white" opacity="0.9"/>
            <!-- Occhi in panico -->
            <circle cx="22" cy="35" r="4.5" fill="white" stroke="#78350F" stroke-width="2"/>
            <circle cx="23" cy="35" r="1.8" fill="#78350F"/>
            <circle cx="42" cy="35" r="4.5" fill="white" stroke="#78350F" stroke-width="2"/>
            <circle cx="41" cy="35" r="1.8" fill="#78350F"/>
            <!-- Goccia di sudore -->
            <path d="M50 24C50 24 47 28 47 30C47 31.6569 48.3431 33 50 33C51.6569 33 53 31.6569 53 30C53 28 50 24 50 24Z" fill="#38BDF8"/>
            <!-- Bocca mossa/agitata -->
            <path d="M25 45Q32 41 39 45" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Titolo & Sottotitolo -->
        <div class="leading-tight">
          <h1 class="text-sm font-black tracking-tight text-white uppercase">
            Ricercatore Fascicoli
          </h1>
          <span class="text-[10px] text-amber-300 font-extrabold tracking-wider uppercase block flex items-center gap-1">
            <span>per Assistenti Disperati</span>
            <i class="fa-solid fa-mug-hot text-[9px] text-amber-200"></i>
          </span>
        </div>

      </div>

      <!-- Badge Stato -->
      <span id="status-badge" class="text-[11px] bg-indigo-600 border border-indigo-400 px-2.5 py-1 rounded-full font-bold whitespace-nowrap shadow-2xs">
        Pronto
      </span>

    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Sezione Dettato Vocale -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Comando Vocale</h2>
      
      <div class="flex justify-center gap-6 my-4">
        <!-- Bottone Aggiungi -->
        <button id="btn-mic-add" onclick="startSpeech('add')" class="w-16 h-16 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex flex-col items-center justify-center shadow-lg transition-transform active:scale-95">
          <i class="fa-solid fa-plus text-xl"></i>
          <span class="text-[10px] uppercase font-bold mt-0.5">Aggiungi</span>
        </button>

        <!-- Bottone Cerca -->
        <button id="btn-mic-search" onclick="startSpeech('search')" class="w-16 h-16 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex flex-col items-center justify-center shadow-lg transition-transform active:scale-95">
          <i class="fa-solid fa-magnifying-glass text-xl"></i>
          <span class="text-[10px] uppercase font-bold mt-0.5">Cerca</span>
        </button>
      </div>

      <p id="transcript-output" class="text-sm text-slate-600 italic bg-slate-50 p-3 rounded-xl min-h-[48px] border border-slate-100 flex items-center justify-center">
        Premi "Aggiungi" per registrare o "Cerca" per interrogare...
      </p>
    </section>

    <!-- Sezione Importazione Excel -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-file-excel text-emerald-600"></i> Importa da Excel (ANNO, NUMERO, TIPO, OP.)
      </h2>
      
      <div class="grid grid-cols-2 gap-2 mb-3">
        <!-- Carica da File Locale -->
        <label class="cursor-pointer bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors">
          <i class="fa-solid fa-upload"></i>
          <span>Carica File</span>
          <input type="file" id="excel-file-input" accept=".xls,.xlsx" class="hidden" onchange="importExcelFromFile(event)">
        </label>

        <!-- Importa dati.xls dalla Root -->
        <button onclick="importExcelFromRoot()" class="bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors">
          <i class="fa-solid fa-cloud-arrow-down text-indigo-600"></i>
          <span>Da Root (dati.xls)</span>
        </button>
      </div>

      <!-- Legenda Colori Sintetica -->
      <div class="text-[10px] text-slate-500 pt-2 border-t border-slate-100 flex flex-wrap gap-2 justify-center">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-200 border border-sky-400 inline-block"></span> 44 IGNOTI</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-200 border border-red-400 inline-block"></span> 45 F.N.C.R.</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-200 border border-emerald-400 inline-block"></span> 21 NOTI ('26)</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-200 border border-amber-400 inline-block"></span> 21 NOTI ('25)</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-200 border border-purple-400 inline-block"></span> 21 NOTI ('24)</span>
      </div>
    </section>

    <!-- Elenco Fascicoli Divisi per Anno -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold text-slate-700">Archivio Fascicoli</h2>
        <button onclick="clearAllData()" class="text-xs text-red-500 hover:underline font-medium">Svuota tutto</button>
      </div>
      
      <div id="years-container" class="space-y-4">
        <!-- Contenuto generato dinamicamente via JS -->
      </div>
    </section>

  </main>

  <!-- MODALE DI CORREZIONE RAPIDA -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl space-y-4">
      
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="text-base font-bold text-slate-800">Modifica Campo</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="modal-content" class="py-2">
        <!-- Generato via JavaScript -->
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
